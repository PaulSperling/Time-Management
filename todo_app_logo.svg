<svg width="600" height="600" viewBox="0 0 600 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>To-do app logo</title>
  <desc>A square logo with a dark background featuring a bar chart and checkmark motif with data grid lines</desc>

  <defs>
    <clipPath id="clip">
      <rect x="0" y="0" width="600" height="600" rx="80"/>
    </clipPath>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="600" height="600" rx="0" fill="#0f1117"/>

  <g clip-path="url(#clip)">

    <!-- Subtle grid lines -->
    <line x1="40" y1="200" x2="640" y2="200" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="40" y1="330" x2="640" y2="330" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="40" y1="460" x2="640" y2="460" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="200" y1="40" x2="200" y2="640" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="340" y1="40" x2="340" y2="640" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="480" y1="40" x2="480" y2="640" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Bar chart bars -->
    <rect x="130" y="370" width="72" height="180" rx="6" fill="#4f8ef7"/>
    <rect x="234" y="270" width="72" height="280" rx="6" fill="#4f8ef7" fill-opacity="0.75"/>
    <rect x="338" y="190" width="72" height="360" rx="6" fill="#4f8ef7" fill-opacity="0.55"/>
    <rect x="442" y="310" width="72" height="240" rx="6" fill="#4f8ef7" fill-opacity="0.4"/>

    <!-- Axis lines -->
    <line x1="108" y1="550" x2="556" y2="550" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="108" y1="130" x2="108" y2="550" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Checkmark circle -->
    <circle cx="490" cy="170" r="68" fill="none" stroke="#22d47a" stroke-width="10"/>
    <!-- Sharp checkmark tick -->
    <polyline points="453,170 478,197 530,143" fill="none" stroke="#22d47a" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>

  </g>

</svg>
